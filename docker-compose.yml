services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-conman}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-conman}
      POSTGRES_DB: ${POSTGRES_DB:-conman}
    ports:
      - "5432:5432"
    volumes:
      - conman_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-conman} -d ${POSTGRES_DB:-conman}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - conman_redis:/data
    profiles: ["redis"]

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-postgresql://conman:conman@db:5432/conman?schema=public}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      APP_URL: ${APP_URL:-http://localhost:5173}
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@conman.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-changeme123}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Con Manager}
      REDIS_URL: ${REDIS_URL:-}
    ports:
      - "4000:4000"
    volumes:
      - conman_uploads:/app/uploads

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  conman_pgdata:
  conman_redis:
  conman_uploads:
