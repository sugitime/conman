# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploys: Postgres + API (Docker) + Web (Docker SPA)

databases:
  - name: conman-db
    plan: free
    databaseName: conman
    user: conman

services:
  - type: web
    name: conman-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: node dist/main.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: conman-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        sync: false
      - key: APP_URL
        sync: false
      - key: UPLOAD_DIR
        value: /opt/render/project/src/backend/uploads
      - key: SEED_ADMIN_EMAIL
        value: admin@conman.local
      - key: SEED_ADMIN_PASSWORD
        generateValue: true
      - key: SEED_ADMIN_NAME
        value: Con Manager

  - type: web
    name: conman-web
    runtime: docker
    plan: free
    region: oregon
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        value: https://conman-api.onrender.com
